name: SonarCloud

on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # PR 装饰/差异分析需要完整历史

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 你的 pom.xml 已默认跳过 assembly；这里直接跑 verify 生成 jacoco.xml
      - name: Build & Test (JaCoCo)
        run: mvn -DskipTests=false -B -V clean verify

      - name: Check JaCoCo report
        run: ls -l target/site/jacoco || true

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=zzy-long746 \
            -Dsonar.projectKey=zzy-long746_solo \
            -Dsonar.login=${SONAR_TOKEN}
