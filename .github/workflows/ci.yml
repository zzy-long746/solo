name: Build Test
on:
  workflow_dispatch: {}   # 只手动触发；Actions 页面会出现 “Run workflow” 按钮

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 关键：跳过 assembly，避免 bin.xml 报错；并运行测试生成 JaCoCo
      - name: Build & Test
        run: mvn -B -V -DskipAssembly=true -DskipTests=false clean verify

      # 如仍想把覆盖率报告发到 Coveralls（可选）
      # 你的 pom 里已有 coveralls 配置；若需请保留这一行：
      #- run: mvn -B -V -DskipAssembly=true coveralls:report -Pci
